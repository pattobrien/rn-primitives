name: Release (fork)

on:
  push:
    tags:
      - "v*-fork.*"
  workflow_dispatch:
    inputs:
      version:
        description: The fork version to publish, e.g. 1.5.3-fork.2; must equal the highest package.json version plus -fork.N
        required: true
        type: string

concurrency:
  group: release-fork-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Build and publish to GitHub Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Authenticate to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pnpm config set @pattobrien:registry https://npm.pkg.github.com
          pnpm config set //npm.pkg.github.com/:_authToken "$NODE_AUTH_TOKEN"

      - name: Publish to GitHub Packages
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          VERSION="${INPUT_VERSION:-$GITHUB_REF_NAME}"
          node scripts/release/fork-publish.ts "${VERSION#v}"
